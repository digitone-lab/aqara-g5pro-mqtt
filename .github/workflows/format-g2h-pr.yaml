name: Temporary G2H PR formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'fix/g2h-pro-stability-profiles-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g2h-pro-stability-profiles-20261125
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Format TypeScript
        working-directory: app
        run: pnpm exec prettier --write "src/**/*.{ts,js,json}"
      - name: Commit formatted code to this PR branch
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src
            git commit -m "style: apply repository Prettier formatting"
            git push origin HEAD:fix/g2h-pro-stability-profiles-20261125
          fi
