name: Build and Publish Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/publish.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Build the Home Assistant add-on on GitHub, not on the memory-limited Pi.
  # This experimental fork currently targets the user's aarch64 HA installation.
  publish-addon:
    name: Build & Publish HA Add-on (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version=$(grep '^version:' app/config.yaml | cut -d '"' -f2)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish prebuilt add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aqara-g5pro-mqtt:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=aqara-ha-addon
          cache-to: type=gha,mode=max,scope=aqara-ha-addon

  # 2. Standalone Multi-Arch Docker Image (for standalone Docker users)
  publish-standalone:
    name: Build & Publish Standalone Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aqara-g5pro-mqtt
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Standalone Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
